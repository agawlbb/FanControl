name: Core tests
on:
  workflow_dispatch:
  push:
    paths: ["apple-watch/**", ".github/workflows/core-tests.yml"]
  pull_request:
    paths: ["apple-watch/**", ".github/workflows/core-tests.yml"]
defaults:
  run:
    working-directory: apple-watch
permissions:
  contents: read
jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select and verify stable Xcode 27.2 and SDKs
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          test "$(xcodebuild -version)" = "$(printf 'Xcode 27.2\nBuild version 27B52')"
          for sdk in macosx iphoneos watchos; do
            version=$(xcrun --sdk "$sdk" --show-sdk-version)
            echo "$sdk SDK: $version"
            test "$version" = 27.2
          done
      - run: swift test
      - name: Typecheck watch sources without building an app
        run: |
          sdk=$(xcrun --sdk watchos --show-sdk-path)
          mkdir -p "$RUNNER_TEMP/watch-typecheck"
          xcrun swiftc -emit-module -parse-as-library -module-name FanControlCore \
            -target arm64_32-apple-watchos10.0 -sdk "$sdk" \
            Sources/FanControlCore/*.swift \
            -emit-module-path "$RUNNER_TEMP/watch-typecheck/FanControlCore.swiftmodule"
          xcrun swiftc -typecheck -parse-as-library -target arm64_32-apple-watchos10.0 \
            -sdk "$sdk" -I "$RUNNER_TEMP/watch-typecheck" WatchApp/*.swift
      - name: Typecheck iPhone sources without building an app
        run: |
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p "$RUNNER_TEMP/phone-typecheck"
          xcrun swiftc -emit-module -parse-as-library -module-name FanControlCore \
            -target arm64-apple-ios17.0 -sdk "$sdk" \
            Sources/FanControlCore/*.swift \
            -emit-module-path "$RUNNER_TEMP/phone-typecheck/FanControlCore.swiftmodule"
          xcrun swiftc -typecheck -parse-as-library -target arm64-apple-ios17.0 \
            -sdk "$sdk" -I "$RUNNER_TEMP/phone-typecheck" PhoneApp/*.swift
