name: watchOS
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Capture unsigned simulator previews without a device archive
        type: boolean
        default: false
      validation_only:
        description: Run core tests and compile unsigned simulators only
        type: boolean
        default: false
defaults:
  run:
    working-directory: apple-watch
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select and verify stable Xcode 27.2 and SDKs
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          sudo xcode-select -s "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          test "$(xcodebuild -version)" = "$(printf 'Xcode 27.2\nBuild version 27B52')"
          for sdk in macosx iphoneos iphonesimulator watchos watchsimulator; do
            version=$(xcrun --sdk "$sdk" --show-sdk-version)
            echo "$sdk SDK: $version"
            test "$version" = 27.2
          done
      - name: Test encrypted transport and command evidence
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile iPhone simulator companion
        if: ${{ !inputs.preview_only }}
        run: xcodebuild -project FanControlWatch.xcodeproj -scheme FanControl -destination 'generic/platform=iOS Simulator' -derivedDataPath build-phone CODE_SIGNING_ALLOWED=NO build
      - name: Capture iPhone companion
        if: ${{ !inputs.validation_only && !inputs.preview_only }}
        run: bash scripts/phone_preview.sh
      - name: Compile watchOS simulator app
        run: xcodebuild -project FanControlWatch.xcodeproj -scheme FanControlWatch -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Capture watch simulator first launch
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.validation_only) }}
        run: bash scripts/simulator_preview.sh
      - name: Compile unsigned watchOS archive
        if: ${{ !inputs.validation_only && !inputs.preview_only }}
        run: xcodebuild -project FanControlWatch.xcodeproj -scheme FanControl -destination 'generic/platform=iOS' -archivePath build/FanControlWatch.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        with:
          name: FanControlWatch-unsigned
          path: |
            apple-watch/build/watch-*.png
            apple-watch/build/watch-simulator-selection.json
            apple-watch/build/phone-*.png
            apple-watch/build-phone/Build/Products/Debug-iphonesimulator/FanControl.app
            apple-watch/build/FanControlWatch.xcarchive
            apple-watch/build/Build/Products/Debug-watchsimulator/FanControlWatch.app
          retention-days: 7


